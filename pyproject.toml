[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitm-archiver"
version = "1.0.0"
description = "Permanent lazy mirror proxy for CI/CD external dependencies"
requires-python = ">=3.10"
dependencies = [
    "mitmproxy>=10.1.0,<11.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-rerunfailures>=12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "requests>=2.31.0",
]

[tool.setuptools]
py-modules = ["archiver", "config"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.pytest.ini_options]
# Retry flaky tests (useful for external API dependencies like httpbin.org)
# --reruns: number of retries
# --reruns-delay: seconds to wait between retries
addopts = "--reruns 3 --reruns-delay 2"

[tool.black]
line-length = 88
target-version = ["py310"]