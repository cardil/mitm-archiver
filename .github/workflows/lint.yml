name: Lint

on:
  push:
    branches:
      - main
      - 'release-**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - 'release-**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Setup development environment
        run: make dev
      
      - name: Run linter
        run: make lint
      
      - name: Check code formatting
        run: |
          make format
          git diff --exit-code || (echo "Code is not formatted. Run 'make format' locally." && exit 1)