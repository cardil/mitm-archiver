name: E2E Tests

on:
  push:
    branches:
      - main
      - 'release-**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - 'release-**'
  workflow_dispatch:

jobs:
  test-local:
    name: Test Local Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Setup environment
        run: make setup
      
      - name: Create test configuration
        run: |
          cat > .env.local << EOF
          CACHE_DIR=./test-data
          LISTEN_PORT=8080
          CERTS_DIR=./test-certs
          EOF
      
      - name: Start proxy in background
        run: |
          mkdir -p test-data test-certs
          nohup make run > proxy.log 2>&1 &
          echo $! > proxy.pid
          
          # Wait for proxy to start
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" --proxy http://localhost:8080 http://httpbin.org/get 2>/dev/null | grep -q "200"; then
              echo "Proxy started successfully"
              break
            fi
            echo "Waiting for proxy... attempt $i/30"
            sleep 2
          done
      
      - name: Run E2E tests
        run: make test
      
      - name: Show proxy logs
        if: always()
        run: cat proxy.log || true
      
      - name: Stop proxy
        if: always()
        run: |
          if [ -f proxy.pid ]; then
            kill $(cat proxy.pid) || true
          fi

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create test configuration
        run: |
          cat > .env << EOF
          CACHE_DIR=./test-data
          LISTEN_PORT=8080
          CERTS_DIR=./test-certs
          EOF
      
      - name: Start with Docker Compose
        run: |
          mkdir -p test-data test-certs
          docker compose up -d
          
          # Wait for proxy to start
          for i in {1..30}; do
            if docker compose logs | grep -q "Proxy server listening"; then
              echo "Proxy started successfully"
              break
            fi
            echo "Waiting for proxy... attempt $i/30"
            sleep 2
          done
      
      - name: Test cache miss (first request)
        run: |
          time curl -x http://localhost:8080 -k -s "https://httpbin.org/bytes/10240" > /dev/null
          echo "Cache miss completed"
      
      - name: Test cache hit (second request)
        run: |
          START=$(date +%s%N)
          curl -x http://localhost:8080 -k -s "https://httpbin.org/bytes/10240" > /dev/null
          END=$(date +%s%N)
          DURATION=$((($END - $START) / 1000000))
          echo "Cache hit took ${DURATION}ms"
          
          # Cache hit should be very fast (< 100ms)
          if [ $DURATION -gt 100 ]; then
            echo "Cache hit too slow: ${DURATION}ms"
            exit 1
          fi
      
      - name: Verify cache files
        run: |
          FILE_COUNT=$(find test-data -type f | wc -l)
          if [ $FILE_COUNT -eq 0 ]; then
            echo "No cache files created"
            exit 1
          fi
          echo "Found $FILE_COUNT cache file(s)"
      
      - name: Show logs
        if: always()
        run: docker compose logs
      
      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  test-quadlet:
    name: Test Quadlet Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python for generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install python-dotenv for generator
        run: pip install python-dotenv
      
      - name: Create test configuration
        run: |
          cat > .env << EOF
          CACHE_DIR=$(pwd)/test-data
          LISTEN_PORT=8080
          CERTS_DIR=$(pwd)/test-certs
          EOF
      
      - name: Generate Quadlet file
        run: |
          mkdir -p test-data test-certs
          python3 scripts/generate-quadlet.py
          cat mitm-archiver.container
      
      - name: Validate Quadlet file
        run: |
          # Verify generated file exists and contains expected content
          if [ ! -f mitm-archiver.container ]; then
            echo "Quadlet file not generated"
            exit 1
          fi
          
          # Check for key sections
          grep -q "\[Container\]" mitm-archiver.container
          grep -q "Image=docker.io/mitmproxy/mitmproxy:latest" mitm-archiver.container
          grep -q "Volume=.*:/opt/mitm-archiver:ro,Z" mitm-archiver.container
          echo "Quadlet file validation passed"